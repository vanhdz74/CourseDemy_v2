services:
  postgres:
    image: postgres:16
    container_name: postgres-CourseDemy
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USERNAME:-${SPRING_DATASOURCE_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${SPRING_DATASOURCE_PASSWORD:-postgres}}
      USER_SERVICE_DB_NAME: ${USER_SERVICE_DB_NAME:-user_service_db}
      COURSE_SERVICE_DB_NAME: ${COURSE_SERVICE_DB_NAME:-course_service_db}
      ORDER_SERVICE_DB_NAME: ${ORDER_SERVICE_DB_NAME:-order_service_db}
      PAYMENT_SERVICE_DB_NAME: ${PAYMENT_SERVICE_DB_NAME:-payment_service_db}
      ENROLLMENT_SERVICE_DB_NAME: ${ENROLLMENT_SERVICE_DB_NAME:-enrollment_service_db}
      NOTIFICATION_SERVICE_DB_NAME: ${NOTIFICATION_SERVICE_DB_NAME:-notification_service_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - spring-microservice

  redis:
    image: redis:7.2
    container_name: redis-CourseDemy
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - spring-microservice

  discovery-service:
    build:
      context: .
      dockerfile: apps/discovery-service/Dockerfile
    container_name: discovery-service-CourseDemy
    ports:
      - "8761:8761"
    networks:
      - spring-microservice

  gateway-service:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    container_name: gateway-service-CourseDemy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-CourseDemy:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    depends_on:
      - discovery-service
    networks:
      - spring-microservice

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service-CourseDemy
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-postgres}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - USER_SERVICE_DB_NAME=${USER_SERVICE_DB_NAME:-user_service_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-CourseDemy:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    depends_on:
      - redis
      - discovery-service
    networks:
      - spring-microservice

  course-service:
    build:
      context: .
      dockerfile: apps/course-service/Dockerfile
    container_name: course-service-CourseDemy
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-postgres}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - COURSE_SERVICE_DB_NAME=${COURSE_SERVICE_DB_NAME:-course_service_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service-CourseDemy:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    depends_on:
      - redis
      - discovery-service
    networks:
      - spring-microservice

volumes:
  postgres_data:
  redis_data:
networks:
  spring-microservice:
    driver: bridge
