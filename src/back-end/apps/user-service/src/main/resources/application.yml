server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: USER-SERVICE
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  autoconfigure: #tắt spring security
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # =========================================================================
  # CẤU HÌNH DATABASE CHO MICROSERVICE (USER SERVICE):
  #
  # [PHƯƠNG ÁN 1] Supabase Cloud PostgreSQL:
  #   - USER_SERVICE_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&currentSchema=user_service_db
  #
  # [PHƯƠNG ÁN 2] PostgreSQL Local / Remote Host riêng biệt:
  #   - Trỏ từ localhost, IP mạng LAN, Docker network, hoặc máy chủ DB riêng:
  #     DB_HOST=localhost (hoặc 192.168.1.100, host.docker.internal)
  #     DB_PORT=5432
  #     USER_SERVICE_DB_NAME=user_service_db
  # =========================================================================
  datasource:
    url: ${USER_SERVICE_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=${DB_SSLMODE:disable}&currentSchema=${USER_SERVICE_DB_NAME:user_service_db}}
    username: ${USER_SERVICE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}}
    password: ${USER_SERVICE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}}
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000}
  secretKey: ${JWT_SECRET:tqg3uhc3x4X+ebUfzqOLnG7yBQhJzhZbg4q27tU8jzE=}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

api:
  prefix:

course:
  limit: 9


fe:
  url: ${FRONTEND_URL:http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}


app:
  seed:
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@coursedemy.local}
      password: ${SEED_ADMIN_PASSWORD:1234}
