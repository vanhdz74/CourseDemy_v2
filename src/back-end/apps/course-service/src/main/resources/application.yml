server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: COURSE-SERVICE
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  autoconfigure: #tắt spring security
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # =========================================================================
  # CẤU HÌNH DATABASE CHO MICROSERVICE (COURSE SERVICE):
  #
  # [PHƯƠNG ÁN 1] Supabase Cloud PostgreSQL:
  #   - COURSE_SERVICE_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&currentSchema=course_service_db
  #
  # [PHƯƠNG ÁN 2] PostgreSQL Local / Remote Host riêng biệt:
  #   - Trỏ từ localhost, IP mạng LAN, Docker network, hoặc máy chủ DB riêng:
  #     DB_HOST=localhost (hoặc 192.168.1.100, host.docker.internal)
  #     DB_PORT=5432
  #     COURSE_SERVICE_DB_NAME=course_service_db
  # =========================================================================
  datasource:
    url: ${COURSE_SERVICE_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=${DB_SSLMODE:disable}&currentSchema=${COURSE_SERVICE_DB_NAME:course_service_db}}
    username: ${COURSE_SERVICE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}}
    password: ${COURSE_SERVICE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}}
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: course-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coursedemy.common.event"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

api:
  prefix:

course:
  limit: 9

jwt:
  secretKey: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000}

fe:
  url: ${FRONTEND_URL:http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8086/api/payment/vnpay/return}

app:
  seed:
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@coursedemy.local}
      password: ${SEED_ADMIN_PASSWORD:1234}
