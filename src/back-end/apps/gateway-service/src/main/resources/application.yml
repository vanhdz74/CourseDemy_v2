server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      routes:
        - id: course-service
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/course/**,/courses/**,/categories/**,/categories,/category/**,/lesson/**,/lessons/**,/sublesson/**,/sublessons/**,/comments/**,/comment/**,/reviews/**,/review/**,/revenue-categories,/revenue-by-month,/revenue-by-days,/revenue/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**,/login,/register,/refresh-token,/send-otp,/verify-otp,/reset-password

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/cart/**,/orders/**,/checkout,/transaction

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**,/payments/**,/payment/**

        - id: enrollment-service
          uri: lb://ENROLLMENT-SERVICE
          predicates:
            - Path=/enrollments/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secretKey: ${JWT_SECRET:tqg3uhc3x4X+ebUfzqOLnG7yBQhJzhZbg4q27tU8jzE=}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:600000} # 10 phút
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 ngày

fe:
  url: ${FRONTEND_URL:http://localhost:3000}
api:
  prefix:
