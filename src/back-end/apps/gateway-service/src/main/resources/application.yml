server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  datasource:
    # jdbc:postgresql://db.xkqcwcedmyflwwngmtcy.supabase.co:5432/postgres?user=postgres&password=[YOUR-PASSWORD]
    url: jdbc:postgresql://db.xkqcwcedmyflwwngmtcy.supabase.co:5432/auth_coursedemy_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6380

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**,/courses/**

        - id: course-service
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/course/**,/categories,/lesson/**,/sublessons/**,/category/**,/revenue-categories,/sublesson/**

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        - id: enrollment-service
          uri: lb://ENROLLMENT-SERVICE
          predicates:
            - Path=/enrollments/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secretKey: ZGV2LW9ubHktY291cnNlZGVteS1qd3Qtc2VjcmV0LTEyMzQ1Ng==
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000} # 1 giờ
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 ngày

fe:
  url: ${FRONTEND_URL:http://localhost:3000}
api:
  prefix:
