server:
  port: 8086

spring:
  application:
    name: payment-service
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:apps/payment-service/.env[.properties]
      - optional:classpath:coursedemy-common.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service_db
    username: postgres
    password: hieuit07
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
# =========================
# Payment Configuration
# =========================

# VNPay Sandbox/Test
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8086/api/payment/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8086/api/payment/vnpay/ipn}

# MoMo Sandbox/Test
momo:
  partner-code: ${MOMO_PARTNER_CODE:}
  access-key: ${MOMO_ACCESS_KEY:}
  secret-key: ${MOMO_SECRET_KEY:}
  endpoint: ${MOMO_PAYMENT_URL:https://test-payment.momo.vn/v2/gateway/api/create}
  redirect-url: ${MOMO_REDIRECT_URL:http://localhost:8086/api/payment/momo/return}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8086/api/payment/momo/ipn}

# Frontend URL for redirects
fe:
  url: ${FRONTEND_URL:http://localhost:3000}
