server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: enrollment-service
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
      - optional:classpath:coursedemy-common.yml
  # =========================================================================
  # CẤU HÌNH DATABASE CHO MICROSERVICE (ENROLLMENT SERVICE):
  #
  # [PHƯƠNG ÁN 1] Supabase Cloud PostgreSQL:
  #   - ENROLLMENT_SERVICE_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&currentSchema=enrollment_service_db
  #
  # [PHƯƠNG ÁN 2] PostgreSQL Local / Remote Host riêng biệt:
  #   - Trỏ từ localhost, IP mạng LAN, Docker network, hoặc máy chủ DB riêng:
  #     DB_HOST=localhost (hoặc 192.168.1.100, host.docker.internal)
  #     DB_PORT=5432
  #     ENROLLMENT_SERVICE_DB_NAME=enrollment_service_db
  # =========================================================================
  datasource:
    url: ${ENROLLMENT_SERVICE_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=${DB_SSLMODE:disable}&currentSchema=${ENROLLMENT_SERVICE_DB_NAME:enrollment_service_db}}
    username: ${ENROLLMENT_SERVICE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}}
    password: ${ENROLLMENT_SERVICE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: enrollment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coursedemy.common.event"
