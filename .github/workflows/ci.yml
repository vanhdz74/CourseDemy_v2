# Tên workflow hiển thị trong tab Actions
name: CourseDemy CI

# Khi nào workflow chạy
on:
  # Chạy khi tạo hoặc cập nhật Pull Request vào nhánh testing
  pull_request:
    branches:
      - testing

  # Chạy khi push trực tiếp lên testing
  push:
    branches:
      - testing

jobs:
  # =========================
  # JOB BUILD BACKEND
  backend:
    # Tên hiển thị trên GitHub Actions
    name: Build Spring Boot

    # Máy ảo GitHub cung cấp
    runs-on: ubuntu-latest

    # Tất cả lệnh run sẽ thực hiện trong thư mục backend
    defaults:
      run:
        working-directory: backend

    steps:
      # Lấy source code từ GitHub
      - name: Checkout Source
        uses: actions/checkout@v4

      # Cài Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          # Dùng OpenJDK Temurin
          distribution: temurin

          # Phiên bản Java
          java-version: 17

          # Cache thư viện Maven
          cache: maven

      # Build project Spring Boot
      - name: Build Backend
        run: mvn clean verify

        # clean:
        #   Xóa build cũ

        # verify:
        #   Compile
        #   Chạy test
        #   Kiểm tra project lỗi hay không

  # =========================
  # JOB BUILD FRONTEND
  frontend:
    name: Build NextJS

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Lấy source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # Cài NodeJS
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node phiên bản 22
          node-version: 22

          # Cache node_modules
          cache: npm

          # Đường dẫn package-lock
          cache-dependency-path: frontend/package-lock.json

      # Cài package
      - name: Install Dependencies
        run: npm ci

        # npm ci:
        # Cài đúng version trong package-lock
        # Nhanh và ổn định hơn npm install

      # Build NextJS
      - name: Build Frontend
        run: npm run build

        # Kiểm tra:
        # - TypeScript
        # - ESLint
        # - Next Build
        # - Lỗi import
        # - Lỗi compile
