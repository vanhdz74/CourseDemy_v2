name: CourseDemy CI

on:
  pull_request:
    branches:
      - testing
      - "release/**"
      - main
      - production

  push:
    branches:
      - testing
      - "release/**"
      - main
      - production

jobs:
  backend:
    name: Build Spring Boot

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coursedemy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coursedemy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: uat
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/coursedemy_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MAIL_USERNAME: ci@example.local
      MAIL_PASSWORD: ci-placeholder
      JWT_SECRET: ZGV2LW9ubHktY291cnNlZGVteS1qd3Qtc2VjcmV0LTEyMzQ1Ng==
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Backend
        run: mvn -B clean verify

  frontend:
    name: Build NextJS

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          AUTH_SECRET: ci-auth-secret
          AUTH_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
