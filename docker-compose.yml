services:
  backend:
    build: ./back-end
    container_name: coursedemy-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/coursedemy_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktY291cnNlZGVteS1qd3Qtc2VjcmV0LTEyMzQ1Ng==}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/payment/vnpay/return}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@coursedemy.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-1234}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my-network

  frontend:
    container_name: coursedemy-frontend
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY:-}
        NEXT_PUBLIC_WEATHER_API_KEY: ${NEXT_PUBLIC_WEATHER_API_KEY:-}
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY:-}
      NEXT_PUBLIC_WEATHER_API_KEY: ${NEXT_PUBLIC_WEATHER_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - my-network

  postgres:
    image: postgres:15
    container_name: coursedemy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coursedemy_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - my-network

    #    Cấu hình ổ đĩa
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-coursedemy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

# các container cần bridge kết nối
networks:
  my-network:
    driver: bridge

volumes:
  postgres-data:
