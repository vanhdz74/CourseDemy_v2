# Cấu hình spring jpa
spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: uat

  # cấu hinhf email
  mail:
    host: smtp.gmail.com
    port: 587
    #    username: vanhnekdungso74@gmail.com
    #    password: odbv zeup ignq lagi
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Redis
  redis:
    host: localhost
    port: 8001
    password:
    timeout: 6000

# value config dùng nhiều nơi
