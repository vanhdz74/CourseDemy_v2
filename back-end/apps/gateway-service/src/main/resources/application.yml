server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
      - optional:classpath:coursedemy-common.yml
  main:
    web-application-type: reactive
  datasource:
    url: ${GATEWAY_SERVICE_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${GATEWAY_SERVICE_DB_NAME:gateway_service_db}}
    username: ${GATEWAY_SERVICE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}}
    password: ${GATEWAY_SERVICE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
  #  cấu hình Spring Cloud Gateway Nó biến service hiện tại thành API Gateway,
  #  nhận request từ frontend rồi chuyển tiếp sang các microservice tương ứng.
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: course-service
              uri: lb://COURSE-SERVICE
              predicates:
                - Path=/courses/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payments/**

            - id: enrollment-service
              uri: lb://ENROLLMENT-SERVICE
              predicates:
                - Path=/enrollments/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**
#  Gateway phải bật Eureka client và connect được Eureka.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
